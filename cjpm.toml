[package]
  organization = "CjKu"
  cjc-version = "1.1.3"
  name = "mapsdk"
  version = "0.2.0"
  repository = "https://github.com/Celading/mapsdk"
  include = ["src", "manual", "examples", "LICENSE", "NOTICE", "CRYPTO-NOTICE", "CHANGELOG.md"]
  exclude = ["_helper", ".git", ".github", "target", "*.log", ".DS_Store", "cangjie-repo.toml", ".env", ".env.*", "*.cjp"]
  output-type = "static"
  src-dir = "src"
  compile-option = "-Woff unused"
  license = "Apache-2.0"
  description = "mapsdk — geodesy, slippy tiles, geohash, GeoJSON; pure Cangjie"
